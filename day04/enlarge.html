<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlarge</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f6f9;
        }

        .enlarge-img {
            width: 220px;
            height: auto;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 3s ease;
        }

        .enlarge-img:hover {
            transform: scale(2) rotate(180deg);
        }
    </style>
</head>
<body>
    <img src="../day01/images/testlogo.avif" alt="Enlarge Image" class="enlarge-img">
</body>
</html>
